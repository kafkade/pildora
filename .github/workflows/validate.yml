name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: "**/*.md"

  # NOTE: The Rust job uses a matrix that produces check names like
  # "Rust (ubuntu-latest)", "Rust (macos-latest)", "Rust (windows-latest)".
  # Adding any of these as required status checks requires updating
  # kafkade/github-infra → repo_pildora.tf (required_status_checks).
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

  wasm:
    name: WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: cargo install wasm-pack
      - run: cd crypto && wasm-pack build --target nodejs --features wasm
      - run: node crypto/tests/wasm_node_test.cjs

  # NOTE: This job validates the UniFFI Swift binding generation pipeline,
  # which requires macOS (uniffi-bindgen loads the compiled .dylib). Its check
  # name is "FFI (macOS)". It is NOT currently a required status check — to
  # promote it to a merge gate, add "FFI (macOS)" to required_status_checks in
  # kafkade/github-infra → repo_pildora.tf.
  ffi:
    name: FFI (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2

      # Builds pildora-crypto-ffi for the macOS host, cross-compiles for the
      # iOS device + simulator targets, generates Swift bindings via
      # uniffi-bindgen, and packages the XCFramework.
      - name: Build XCFramework + generate Swift bindings
        run: bash ios/ffi-spike/build-xcframework.sh

      # Type-check the generated Swift bindings against the generated C FFI
      # module to verify they compile. (The spike's XCFramework only ships iOS
      # slices, so a full host link isn't possible — a type-check is the right
      # validation that the generated Swift is valid.)
      - name: Compile generated Swift bindings
        working-directory: ios/ffi-spike/generated
        run: |
          swiftc -typecheck pildora_crypto_ffi.swift \
            -Xcc -fmodule-map-file=pildora_crypto_ffiFFI.modulemap \
            -I .

  # NOTE: Validates the iOS Swift feature/data packages via `swift test` on the
  # macOS toolchain (plain SQLite; SQLCipher is exercised in the Xcode app
  # target, not here). Its check name is "iOS Packages (macOS)". It is NOT
  # currently a required status check — to promote it to a merge gate, add
  # "iOS Packages (macOS)" to required_status_checks in
  # kafkade/github-infra → repo_pildora.tf.
  ios-packages:
    name: iOS Packages (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Swift package tests
        run: |
          for pkg in \
            ios/design-system/PildoraDesignSystem \
            ios/data-layer/PildoraDataLayer \
            ios/drug-index/PildoraDrugIndex \
            ios/today-view/PildoraTodayView \
            ios/notification-scheduler/PildoraNotificationScheduler \
            ios/medication-list/PildoraMedicationList; do
            echo "== swift test: $pkg =="
            swift test --package-path "$pkg"
          done

  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: pytest

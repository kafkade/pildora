name: Pildora
options:
  bundleIdPrefix: com.kafkade.pildora
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # The Rust build phase shells out to cargo and reads/writes outside the
    # target's sandbox, so user-script sandboxing must be disabled.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

packages:
  # Local monorepo packages. `PildoraMedicationList` transitively brings in
  # `PildoraDataLayer`, `PildoraDrugIndex`, and GRDB, but we depend on each
  # product explicitly where the app uses its types directly (bootstrap).
  PildoraMedicationList:
    path: ../medication-list/PildoraMedicationList
  PildoraDataLayer:
    path: ../data-layer/PildoraDataLayer
  PildoraDrugIndex:
    path: ../drug-index/PildoraDrugIndex
  # Tiered drug-index loader (issue #68): bundles the compact core index and
  # downloads + verifies the full index from a CDN on first launch. Networking
  # lives here so the read-only PildoraDrugIndex reader stays offline-only.
  PildoraDrugIndexLoader:
    path: ../drug-index-loader/PildoraDrugIndexLoader
  # Shared SwiftUI design system (issue #43). Transitively pulled in via
  # PildoraMedicationList / PildoraTodayView, but declared explicitly so the app
  # can embed the DesignSystemCatalog directly.
  PildoraDesignSystem:
    path: ../design-system/PildoraDesignSystem
  # First-run onboarding (issue #53): master password, recovery key + PDF, first
  # vault, biometric opt-in. Self-contained SwiftUI slice built on the design
  # system; the app supplies the FFI-backed crypto seam.
  PildoraOnboarding:
    path: ../onboarding/PildoraOnboarding
  # Move-only zeroizing byte buffers (issue #40), used by the app's FFI-backed
  # onboarding crypto to wipe key material after wrapping.
  PildoraSecureMemory:
    path: ../secure-memory/PildoraSecureMemory

targets:
  Pildora:
    type: application
    platform: iOS
    sources:
      - path: Pildora
        # The C header and module map are consumed via SWIFT_INCLUDE_PATHS, not
        # compiled directly, so keep them out of the project's build phases.
        excludes:
          - "Generated/pildora_crypto_ffiFFI.h"
          - "Generated/module.modulemap"
    dependencies:
      - package: PildoraMedicationList
        product: PildoraMedicationList
      - package: PildoraDataLayer
        product: PildoraDataLayer
      - package: PildoraDrugIndex
        product: PildoraDrugIndex
      - package: PildoraDrugIndexLoader
        product: PildoraDrugIndexLoader
      - package: PildoraDesignSystem
        product: PildoraDesignSystem
      - package: PildoraOnboarding
        product: PildoraOnboarding
      - package: PildoraSecureMemory
        product: PildoraSecureMemory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kafkade.pildora
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"

        # Base URL the tiered drug-index loader fetches `manifest.json` and the
        # compressed full index from (issue #68). Empty by default ⇒ the app
        # runs in core-only mode (no network). Override per-configuration (e.g.
        # via an xcconfig) to point at the CDN. This is a public reference-data
        # endpoint; no user data or query text is ever sent to it.
        INFOPLIST_KEY_PildoraDrugIndexBaseURL: ""

        # Expose the UniFFI-generated `pildora_crypto_ffiFFI` Clang module
        # (module.modulemap + header) to the Swift importer.
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Pildora/Generated"

        # Link the static library that the Rust build phase stages into
        # BUILT_PRODUCTS_DIR.
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(BUILT_PRODUCTS_DIR)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lpildora_crypto_ffi"
    preBuildScripts:
      - name: "Generate bundled core drug index (core-index.db)"
        path: Scripts/generate-core-index.sh
        # Regenerates the bundled core index from core-seed.json when the seed
        # changes. Non-fatal on failure: the app builds the core index from the
        # bundled JSON at first launch if the prebuilt .db is absent.
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(SRCROOT)/Pildora/Resources/core-seed.json"
        outputFiles:
          - "$(SRCROOT)/Pildora/Resources/core-index.db"
      - name: "Build Rust crypto (pildora-crypto-ffi)"
        path: Scripts/cargo-build-phase.sh
        # cargo performs its own fine-grained incremental compilation, so this
        # phase is allowed to run every build (it is a fast no-op when no Rust
        # sources changed). The staged library is declared as an output so the
        # linker correctly depends on it.
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/libpildora_crypto_ffi.a"

  PildoraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PildoraUITests
    dependencies:
      - target: Pildora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kafkade.pildora.uitests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Pildora:
    build:
      targets:
        Pildora: all
        PildoraUITests: [test]
    test:
      targets:
        - PildoraUITests
    run:
      config: Debug
